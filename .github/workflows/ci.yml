name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for an explicit GITHUB_TOKEN continuation
        required: false
        type: string
      base_sha:
        description: Validated pull request base SHA
        required: false
        type: string
      head_sha:
        description: Validated pull request head SHA
        required: false
        type: string
      head_ref:
        description: Validated pull request head ref
        required: false
        type: string
      actor_login:
        description: Pull request author login
        required: false
        type: string
      actor_type:
        description: Pull request author type
        required: false
        type: string
      labels_json:
        description: JSON array of pull request label names
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint --if-present

      - name: Typecheck
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run typecheck --if-present

      - name: Test
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run test --if-present

      - name: Build
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build --if-present

      - name: Record sparse-repository skip
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "package.json is not present; application checks are not yet applicable."

  agentic-workflows:
    name: GH-AW compiled workflow freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install pinned gh-aw
        uses: github/gh-aw-actions/setup-cli@924af5fdc64061cfbf66fb584c8b07e2ac230c60 # v0.89.21

      - name: Verify gh-aw version
        shell: bash
        run: |
          set -euo pipefail
          gh aw --version 2>&1 | grep -Fx "gh aw version v0.89.21"

      - name: Compile agentic workflows
        run: gh aw compile --strict --no-check-update

      - name: Check compiled workflows are fresh
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows

  squad-install:
    name: Squad installation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run Squad install verifier
        run: node .github/workflows/shared/squad-install-verifier.mjs --verify-install

      - name: Test Squad bootstrap transport
        run: node --test .github/workflows/shared/squad-bootstrap-validator.test.mjs

  protected-path-policy:
    name: Protected path policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test protected-path policy
        run: node --test .github/scripts/protected-path-policy.test.mjs

      - name: Test autonomous factory control plane
        run: >-
          node --test
          .github/scripts/autonomous-merge-gate.test.mjs
          .github/scripts/factory-controller-policy.test.mjs
          .github/scripts/factory-pr-continuation.test.mjs

      - name: Collect changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha || '' }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_BASE_SHA" && -n "$INPUT_HEAD_SHA" ]]; then
            git diff --name-only -z "$INPUT_BASE_SHA" "$INPUT_HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          elif [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git ls-tree -r --name-only -z "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          else
            git diff --name-only -z "$BEFORE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          fi

      - name: Build protected-path policy event
        id: policy-event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
          HEAD_REF: ${{ inputs.head_ref || '' }}
          ACTOR_LOGIN: ${{ inputs.actor_login || '' }}
          ACTOR_TYPE: ${{ inputs.actor_type || '' }}
          LABELS_JSON: ${{ inputs.labels_json || '[]' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" || -z "$PR_NUMBER" ]]; then
            echo "path=$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n \
            --arg login "$ACTOR_LOGIN" \
            --arg type "$ACTOR_TYPE" \
            --arg head_ref "$HEAD_REF" \
            --argjson labels "$LABELS_JSON" \
            '{
              event_name: "pull_request",
              sender: {login: $login},
              pull_request: {
                user: {login: $login, type: $type},
                head: {ref: $head_ref},
                labels: ($labels | map({name: .}))
              }
            }' > "$RUNNER_TEMP/protected-path-event.json"
          echo "path=$RUNNER_TEMP/protected-path-event.json" >> "$GITHUB_OUTPUT"

      - name: Enforce protected-path policy
        run: >-
          node .github/scripts/protected-path-policy.mjs
          --event "${{ steps.policy-event.outputs.path }}"
          --files0 "$RUNNER_TEMP/changed-files"

  publish-dispatched-statuses:
    name: Publish dispatched CI statuses
    needs:
      - application
      - agentic-workflows
      - squad-install
      - protected-path-policy
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted status bridge
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-control-plane
          persist-credentials: false

      - name: Revalidate pull request and publish commit statuses
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
          INPUT_BASE_SHA: ${{ inputs.base_sha || '' }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha || '' }}
          INPUT_HEAD_REF: ${{ inputs.head_ref || '' }}
          INPUT_ACTOR_LOGIN: ${{ inputs.actor_login || '' }}
          INPUT_ACTOR_TYPE: ${{ inputs.actor_type || '' }}
          INPUT_LABELS_JSON: ${{ inputs.labels_json || '' }}
          APPLICATION_RESULT: ${{ needs.application.result }}
          AGENTIC_WORKFLOWS_RESULT: ${{ needs.agentic-workflows.result }}
          SQUAD_INSTALL_RESULT: ${{ needs.squad-install.result }}
          PROTECTED_PATH_POLICY_RESULT: ${{ needs.protected-path-policy.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const bridge = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  "trusted-control-plane",
                  ".github",
                  "scripts",
                  "workflow-dispatch-status-bridge.mjs",
                ),
              ).href
            );

            const { owner, repo } = context.repo;
            const result = await bridge.publishWorkflowDispatchStatuses({
              github,
              owner,
              repo,
              defaultBranch: context.payload.repository.default_branch,
              runHeadSha: context.sha,
              runId: context.runId,
              serverUrl: process.env.GITHUB_SERVER_URL,
              rawInputs: {
                prNumber: process.env.INPUT_PR_NUMBER,
                baseSha: process.env.INPUT_BASE_SHA,
                headSha: process.env.INPUT_HEAD_SHA,
                headRef: process.env.INPUT_HEAD_REF,
                actorLogin: process.env.INPUT_ACTOR_LOGIN,
                actorType: process.env.INPUT_ACTOR_TYPE,
                labelsJson: process.env.INPUT_LABELS_JSON,
              },
              jobResults: {
                application: process.env.APPLICATION_RESULT,
                agenticWorkflows: process.env.AGENTIC_WORKFLOWS_RESULT,
                squadInstall: process.env.SQUAD_INSTALL_RESULT,
                protectedPathPolicy:
                  process.env.PROTECTED_PATH_POLICY_RESULT,
              },
            });
            core.notice(
              `Published ${result.statuses.length} required statuses on ${result.headSha}.`,
            );
