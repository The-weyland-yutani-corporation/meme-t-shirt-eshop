name: "Meme Merch: Azure Storefront Accelerator"
summary: >-
  A credential-free Next.js merchandise demo connecting synthetic catalog
  discovery to a simulated purchase outcome, with Azure deployment patterns.
repository: "https://github.com/The-weyland-yutani-corporation/meme-t-shirt-eshop"
status: "local-demo-candidate"
desired_readiness: "catalog-ready"
customer_scope: "Reusable"
industries:
  - "Retail"
  - "Consumer Goods"
personas:
  - "Commerce product owner"
  - "Developer"
  - "Platform engineer"
business_problem: >-
  Teams need a concrete way to evaluate merchandise storefront and integration
  requirements before investing in a larger implementation.
business_outcome: >-
  A demonstrated synthetic shopper journey, reusable technical patterns,
  and an agreed customer pilot backlog.
technologies:
  - "Next.js"
  - "TypeScript"
  - "Azure App Service"
  - "Azure Monitor Application Insights"
  - "Bicep"
  - "GitHub Actions"
integrations:
